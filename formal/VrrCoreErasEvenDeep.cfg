\* Even-split behavioral envelope for fixed-seed simulation: the era-1
\* establishing command may commit dynamically at MaxLogLength 3.  The
\* exhaustive even configuration checks the cast and static gate at
\* MaxLogLength 2; the VrrCoreErasEvenOverlap witness proves non-vacuity of
\* the overlap behavior at length 3.
CONSTANTS
    N0 = n0
    N1 = n1
    N2 = n2
    N3 = n3
    N4 = n4
    N5 = n5
    Scenario = "even4"
    Commands = {cmd}
    MaxViewIndex = 0
    MaxLogLength = 3
    MaxEpoch = 0
    MaxNonce = 1
    CrashRetainsDurable = FALSE
    Defect = "none"

SPECIFICATION Spec
CHECK_DEADLOCK FALSE

INVARIANTS
    TypeOK
    FrontiersOrdered
    NormalViewInstalled
    ViewChangeRetainsHistoryProvenance
    CommittedLogsAgree
    CommittedHistoryUnique
    CommittedHistoryPresent
    EntryEraWindow
    EraOneHasEstablishingOp
    AtMostOneReconfig
    PlannedTargetsWellFormed

PROPERTIES
    RecoveringSendsNothing
