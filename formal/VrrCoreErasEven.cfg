\* Four equal-weight nodes; era-1 weights 2,1,1,1.  R2 holds only because
\* the era-1 view threshold is 4 (see the README's per-scenario
\* derivation).  MaxLogLength 2 exercises the cast and both view-change
\* paths exhaustively; the era-1 establishing command stays
\* accepted-but-uncommitted here, with the length-3 behavioral envelope
\* covered by the fixed-seed VrrCoreErasEvenDeep simulation and the
\* VrrCoreErasEvenOverlap non-vacuity witness.
CONSTANTS
    N0 = n0
    N1 = n1
    N2 = n2
    N3 = n3
    N4 = n4
    N5 = n5
    Scenario = "even4"
    Commands = {cmd}
    MaxViewIndex = 0
    MaxLogLength = 2
    MaxEpoch = 0
    MaxNonce = 1
    CrashRetainsDurable = FALSE
    Defect = "none"

SPECIFICATION Spec
CHECK_DEADLOCK FALSE

INVARIANTS
    TypeOK
    FrontiersOrdered
    NormalViewInstalled
    ViewChangeRetainsHistoryProvenance
    CommittedLogsAgree
    CommittedHistoryUnique
    CommittedHistoryPresent
    EntryEraWindow
    EraOneHasEstablishingOp
    AtMostOneReconfig
    PlannedTargetsWellFormed

PROPERTIES
    RecoveringSendsNothing
