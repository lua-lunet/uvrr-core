<text x="24" y="376" font-size="12.5" fill="#334155" text-anchor="start" font-weight="bold">Era 1 — crossing batch DECREMENT(C)+JOIN(D): weights (A,B,C,D) = (1,1,0,0); D joins at weight 0</text>
<text x="24" y="391" font-size="12.5" fill="#334155" text-anchor="start" font-weight="bold">(standby); forming quorum {A,B} = mass 2 of total 2</text>
