<text x="24" y="583" font-size="12.5" fill="#334155" text-anchor="start" font-weight="bold">Era 2 — INCREMENT(D)+LEAVE(C): weights (A,B,D) = (1,1,1); D promoted 0→1, C leaves at weight 0;</text>
<text x="24" y="598" font-size="12.5" fill="#334155" text-anchor="start" font-weight="bold">forming quorum {A,B} = mass 2 of total 3 — the same set as era 1, so the quorums coincide and</text>
<text x="24" y="613" font-size="12.5" fill="#334155" text-anchor="start" font-weight="bold">leader B carries both eras without a pivot</text>
