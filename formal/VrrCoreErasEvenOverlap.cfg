\* Expected-failure witness: in the even split, an era-1 slot must be able
\* to commit while the primary still occupies an era-0 view (the overlap
\* streaming behavior).  TLC must find a behavior violating WOverlapStreams;
\* the Makefile inverts the result.  Non-vacuity for the corrected four-node
\* configuration under the behavioral bound MaxLogLength 3.
CONSTANTS
    N0 = n0
    N1 = n1
    N2 = n2
    N3 = n3
    N4 = n4
    N5 = n5
    Scenario = "even4"
    Commands = {cmd}
    MaxViewIndex = 0
    MaxLogLength = 3
    MaxEpoch = 0
    MaxNonce = 1 CrashRetainsDurable=FALSE
    Defect = "none"

SPECIFICATION Spec
CHECK_DEADLOCK FALSE
INVARIANT WOverlapStreams
