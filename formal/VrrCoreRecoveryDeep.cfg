\* Full-machinery crash/recovery envelope for fixed-seed simulation: two
\* durability profiles and nonce-set re-drive enabled.  The exhaustive
\* recovery configuration pins the volatile profile; this simulation covers
\* the durable profile, cross-nonce combining, fast-forward, and the
\* completion floor over long adversarial traces.
CONSTANTS
    R0 = r0
    R1 = r1
    R2 = r2
    Commands = {c1, c2}
    MaxView = 1
    MaxLogLength = 3
    MaxEpoch = 1
    MaxNonce = 1
    CrashRetainsDurable = TRUE

SPECIFICATION Spec

INVARIANTS
    TypeOK
    FrontiersOrdered
    NormalViewInstalled
    ViewChangeRetainsHistoryProvenance
    CommittedLogsAgree
    AppliedLogsAgree
    CommittedHistoryUnique
    CommittedHistoryPresent
    ReplayingIsFenced
