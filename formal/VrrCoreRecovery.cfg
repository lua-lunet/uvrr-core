\* Crash/recovery exploration: two commands and one fenced amnesiac crash
\* event.  Two values keep divergent slot-3 histories expressible, so prefix
\* agreement is checked rather than masked by value collision.
CONSTANTS
    R0 = r0
    R1 = r1
    R2 = r2
    Commands = {c1, c2}
    MaxView = 1
    MaxLogLength = 3
    MaxEpoch = 1
    MaxNonce = 1 CrashRetainsDurable=FALSE

SPECIFICATION Spec

INVARIANTS
    TypeOK
    FrontiersOrdered
    NormalViewInstalled
    ViewChangeRetainsHistoryProvenance
    CommittedLogsAgree
    AppliedLogsAgree
    CommittedHistoryUnique
    CommittedHistoryPresent
    ReplayingIsFenced

CHECK_DEADLOCK FALSE
