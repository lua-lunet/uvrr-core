[package]
name = "vrr-core"
version = "0.1.0"
edition = "2024"
# Edition 2024 requires 1.85, which sets this floor. Enforced by clippy's msrv
# lints, so a newer API cannot creep in unnoticed.
rust-version = "1.85"
description = "Sans-io Viewstamped Replication Revisited core (normal operation, view change, recovery, state transfer) with a C ABI for LuaJIT FFI."
repository = "https://github.com/simbo1905/vrr-core"
license = "MIT"
readme = "README.md"
keywords = ["consensus", "replication", "viewstamped", "vsr", "raft"]
# Not a no-std category: the core uses Vec, BTreeMap and String.
categories = [
    "algorithms",
    "network-programming",
    "concurrency",
    "external-ffi-bindings",
]
exclude = ["maelstrom/", "store/", ".state/", "mise.toml", ".gitmodules"]

# `name = "vrr"` deliberately differs from the package name. The cdylib and
# staticlib artifacts are named after the lib target, and the C ABI symbol
# prefix and the shared-object name a LuaJIT host dlopens are `vrr`, not
# `vrr_core`.
[lib]
name = "vrr"
crate-type = ["rlib", "cdylib", "staticlib"]

# Every entry is optional, so a consumer's non-optional dependency set is empty
# and `default-features = false` pulls in zero transitive crates. Enforced by
# tests/manifest_contract.rs, which is a gate rather than a smoke test.
[dependencies]
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }

# `serde` buys derives on the wire types only. It never becomes the wire format:
# the binary codec in `wire` is normative so the spec §13.1 suffix budget stays
# deterministic (decision P3). `maelstrom` adds the JSON debug bridge and the
# Maelstrom node binary.
[features]
default = []
serde = ["dep:serde"]
maelstrom = ["serde", "dep:serde_json"]

# Build-time tooling for `cargo test`, not a consumer's supply chain: nothing here
# reaches a crate that depends on `vrr-core`, and the [dependencies] gate above is
# what protects the consumer. Bounded by an explicit allowlist rather than left open
# — tests/manifest_contract.rs asserts this table names exactly {proptest,
# serde_json}, so a further entry requires a P3 amendment rather than a quiet commit.
[dev-dependencies]
proptest = "1.11.0"
serde_json = "1"
