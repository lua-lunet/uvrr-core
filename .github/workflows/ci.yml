name: CI

# Lane split modeled on the sibling lua-lunet/lunet-locks CI (itself modeled
# on upstream lua-lunet/lunet): regular builds (pull requests, pushes to the
# working branches) run the fast Linux lane; tagged builds (v*) verify the
# tag matches the manifest version, add macOS, package per-platform release
# archives of the C ABI library, and publish-release creates the GitHub
# release. A release tag publishes only when Cargo.toml's version equals the
# tag: the bump is part of the change that earns the release.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, uVRR]
    tags:
      - 'v*'

permissions:
  contents: write # publish-release creates GitHub releases on v* tags

# Cancel previous runs when a new commit is pushed to the same PR/branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  setup-matrix:
    name: Setup build matrix
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      # The release discipline, checked once before the lanes start: a v*
      # tag publishes only when the manifest version equals the tag. A
      # forgotten bump blocks the release instead of shipping a lie.
      # Branch and PR builds have no tag and skip this step.
      - name: Verify the tag matches the manifest version
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME#v}"
          CARGO=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [ -z "$CARGO" ]; then
            echo "could not read the manifest version" >&2
            exit 1
          fi
          if [ "$TAG" != "$CARGO" ]; then
            echo "tag v$TAG does not match manifest version $CARGO" >&2
            exit 1
          fi
      - id: set-matrix
        run: |
          # The lane: Linux amd64 + arm64 + macOS — the branch rules require the macos status check on every run.
          ALL='{"include":[{"os":"ubuntu-24.04","target_key":"linux-amd64"},{"os":"blacksmith-4vcpu-ubuntu-2404-arm","target_key":"linux-arm64"},{"os":"macos-latest","target_key":"macos"}]}'

          echo "matrix=$ALL" >> "$GITHUB_OUTPUT"
  gate:
    name: ${{ matrix.target_key }}
    needs: setup-matrix
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.setup-matrix.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      # One toolchain: CI builds with exactly the toolchain the crate is
      # built and released with locally (recorded in AGENTS.md and
      # Cargo.toml's rust-version). There is no separate MSRV lane and no
      # deliberate older pin: a toolchain exists to build this code, and a
      # version CI does not share with the developers hides lint drift
      # until it blocks a release.
      - uses: dtolnay/rust-toolchain@1.96
        with:
          components: rustfmt, clippy
      - name: Ensure ripgrep
        shell: bash
        run: |
          if ! command -v rg >/dev/null; then
            if [ "${{ runner.os }}" = "Linux" ]; then
              sudo apt-get update && sudo apt-get install --yes ripgrep
            else
              brew install ripgrep
            fi
          fi
      # The repository verification gate, run exactly as it is run locally.
      - name: Verification gate
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --check
          cargo clippy --all-targets --all-features -- -D warnings
          # The test lane runs fast first, then slow: the default-feature
          # run compiles the maelstrom adapter tests to nothing and never
          # boots the harness (the library, not the harness, is the
          # deliverable); the second, slower run is the full feature set,
          # driving the real maelstrom-lin-kv binary end to end. The `uvrr`
          # demo example is excluded from both: it links the vendored
          # TigerBeetle static library, which build.sh builds on the host
          # that packages tagged releases, and no runner checkout carries
          # that artifact.
          cargo test --lib --bins --tests
          cargo test --features maelstrom --lib --bins --tests
          cargo test --doc
          ! rg -n '#\[cfg\(test\)\]|mod tests' src
          ! rg -in 'paxos' src/ tests/
          # `item[0-9]` is scratch-work numbering: forbidden in the product
          # tree, exempt in the committed evidence archives (research/ and
          # the dated formal/ reports and lab book).
          ! (git ls-files | rg -v '^maelstrom|^research/|^formal/|\.github/' | xargs rg -n 'item[0-9]')
      # Tagged builds only: package the C ABI library (cdylib + staticlib)
      # from the tree that just passed the gate, for publish-release.
      - name: Package release archive
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          set -euo pipefail
          cargo build --release --all-features
          stage="uvrr-core-${{ matrix.target_key }}"
          mkdir -p "$stage"
          if [ "${{ runner.os }}" = "macOS" ]; then
            cp target/release/libuvrr.dylib target/release/libuvrr.a "$stage/"
          else
            cp target/release/libuvrr.so target/release/libuvrr.a "$stage/"
          fi
          tar czf "uvrr-core-${{ matrix.target_key }}.tar.gz" -C "$stage" .
      - name: Upload release archive
        if: github.ref_type == 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target_key }}
          path: uvrr-core-${{ matrix.target_key }}.tar.gz
          retention-days: 5

  # Tagged builds only, modeled on the sibling's publish-release: runs after
  # every gate lane passed and creates the GitHub release with all platform
  # archives attached.
  publish-release:
    name: Publish release
    if: github.ref_type == 'tag'
    needs: [gate]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Download release archives
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: release-assets
      - name: Verify expected archives
        run: |
          set -euo pipefail
          ls -la release-assets
          for target in linux-amd64 linux-arm64 macos; do
            test -f "release-assets/uvrr-core-$target.tar.gz" || {
              echo "missing release asset: uvrr-core-$target.tar.gz" >&2
              exit 1
            }
          done
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release-assets/uvrr-core-linux-amd64.tar.gz
            release-assets/uvrr-core-linux-arm64.tar.gz
            release-assets/uvrr-core-macos.tar.gz
